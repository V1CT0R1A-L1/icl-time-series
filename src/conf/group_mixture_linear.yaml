inherit:
  - models/small.yaml
  - wandb.yaml

model:
  n_dims: 5        # input dimension
  n_positions: 100   # need n_positions//2 >= max length; K=3,C=10,T=6 => 37, so >= 74
  use_pairs_format: true #TODO: change this to false # one token per (x,y), last token = [x_query; 0]; standard ICL layout, often learns better than interleaved

training:
  task: group_mixture_linear
  data: group_mixture_linear
  task_kwargs:
    n_components: 2             # K
    # Collaborator notation: T_ctx / T_tgt (legacy keys kept for train.py curriculum)
    contexts_per_component: 10  # T_ctx (curriculum.points drives current T_ctx during training)
    target_cluster_context_points: 10  # T_tgt (labeled points in target cluster)
    # Main collaborator setting: observation noise σ=0.2 (use group_mixture_linear_noiseless.yaml for σ=0)
    noise_std: 0.2
    scale: 1.0                # y = scale * x^T β; β unit-norm on active coords
    normalize_ys: false
    predict_target_only: false
    shuffle_context_points: false
    # First-of-segment positions have no same-cluster context; excluding them from the
    # train loss avoids a ~Var(y) floor that can hide real learning.
    exclude_first_of_segment_loss: true
  batch_size: 64
  learning_rate: 0.0005
  lr_warmup_steps: 300
  save_every_steps: 1000
  keep_every_steps: 100000
  train_steps: 50001
  # resume: true = load state.pt when present. resume: false = always start from step 0 (ignore state.pt).
  resume: false
  # Curriculum: points = T_ctx during training.
  # Note: β is renormalized on the active dims (see sampler), so early k<<d still has Var(y)≈1.
  curriculum:
    dims:
      start: 2
      end: 5
      inc: 1
      interval: 3000
    points:
      start: 7
      end: 10
      inc: 1
      interval: 3000

out_dir: ../models/group_mixture_linear

wandb:
  name: "group_mixture_linear"

test_run: False
