inherit:
  - models/small.yaml
  - wandb.yaml

model:
  n_dims: 5        # input dimension
  n_positions: 100   # need n_positions//2 >= N_total
  # pairs format only helps when predict_target_only=true (single query).
  # With predict_all, training uses interleaved (x,y) + one causal forward.
  use_pairs_format: false

training:
  task: group_mixture_linear
  data: group_mixture_linear
  task_kwargs:
    n_components: 2             # K
    contexts_per_component: 10  # T_ctx (curriculum.points drives current T_ctx)
    target_cluster_context_points: 10  # T_tgt
    noise_std: 0.2
    scale: 1.0
    normalize_ys: false
    predict_target_only: false
    shuffle_context_points: false
    exclude_first_of_segment_loss: true
  batch_size: 64
  learning_rate: 0.0005
  lr_warmup_steps: 300
  save_every_steps: 1000
  keep_every_steps: 100000
  train_steps: 50001
  # resume: true = load state.pt when present. resume: false = always start from step 0 (ignore state.pt).
  resume: false
  curriculum:
    dims:
      start: 2
      end: 5
      inc: 1
      interval: 5000
    points:
      start: 5
      end: 10
      inc: 1
      interval: 5000

out_dir: ../models/group_mixture_linear

wandb:
  name: "group_mixture_linear"

test_run: False
