inherit:
  - models/small.yaml
  - wandb.yaml

model:
  n_dims: 20
  n_positions: 50   # N_total = K*T_ctx + (T_tgt + 1)

training:
  task: group_mixture_linear
  data: group_mixture_linear
  task_kwargs:
    n_components: 3  # K
    contexts_per_component: 5  # T_ctx
    target_cluster_context_points: 3  # T_tgt
    noise_std: 0.2  # collaborator main setting; set 0.0 for noiseless
    scale: 1.0  # y = scale * x^T β; β on unit sphere
  batch_size: 64
  learning_rate: 0.0001
  save_every_steps: 1000
  keep_every_steps: 100000
  train_steps: 5001
  curriculum:
    dims:
      start: 50
      end: 50
      inc: 1
      interval: 2000
    points:
      start: 14   # curriculum drives T_ctx
      end: 14
      inc: 2
      interval: 2000

out_dir: ../models/group_mixture_linear_simple

wandb:
  name: "group_mixture_linear_1comp"

test_run: False
